<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../../css/authCss/login.css">
</head>
<body>
    <div class="login-container">
        <form id="loginForm" class="login-form">
            <h1>Đăng nhập</h1>
            <p class="description">Đăng nhập để tiếp tục sử dụng hệ thống</p>
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Nhập địa chỉ email"
                    autocomplete="email"
                    required
                >

                <small id="emailError" class="error-message"></small>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                    >
                        Hiện
                    </button>
                </div>
                <small id="passwordError" class="error-message"></small>
            </div>
            <div class="login-options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Ghi nhớ đăng nhập
                </label>

                <a href="#" class="forgot-password">Quên mật khẩu?</a>
            </div>
            <p id="loginMessage" class="login-message"></p>
            <button type="submit" id="loginButton" class="login-button">
                Đăng nhập
            </button>
            <p class="register-link">
                Chưa có tài khoản?
                <a href="../auth/register.html">Đăng ký ngay</a>
            </p>
        </form>
    </div>

    <script type="module" src="../../js/authJs/login.js"></script>
</body>
</html>
