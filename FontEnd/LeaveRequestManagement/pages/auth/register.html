<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - LeaveManager</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/authCss/register.css">
</head>
<body>
    <div class="page">
        <div class="shape shape-left"></div>
        <div class="shape shape-right"></div>

        <!-- HEADER -->
        <header class="header">
            <a href="../../index.html" class="logo">
                <div class="logo-icon">✓</div>
                <div class="logo-text">
                    <h2>LeaveManager</h2>
                    <span>LEAVE MANAGEMENT SYSTEM</span>
                </div>
            </a>
        </header>

        <!-- MAIN -->
        <main class="main">
            <section class="register-card">
                <div class="title">
                    <h1>Đăng ký tài khoản</h1>
                    <p>Tạo tài khoản nhân viên để sử dụng hệ thống</p>
                </div>

                <form id="registerForm">
                    <!-- EMPLOYEE CODE -->
                    <div class="form-group">
                        <label for="employeeCode">Mã nhân viên <span>*</span></label>
                        <input type="text" id="employeeCode" placeholder="Ví dụ: NV001" required>
                    </div>

                    <!-- FULL NAME -->
                    <div class="form-group">
                        <label for="fullName">Họ và tên <span>*</span></label>
                        <input type="text" id="fullName" placeholder="Nhập họ và tên" required>
                    </div>

                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="email">Email <span>*</span></label>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>

                    <!-- PASSWORD -->
                    <div class="form-group">
                        <label for="password">Mật khẩu <span>*</span></label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                    </div>

                    <!-- PHONE -->
                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="text" id="phone" placeholder="Nhập số điện thoại">
                    </div>

                    <!-- ADDRESS -->
                    <div class="form-group">
                        <label for="address">Địa chỉ</label>
                        <input type="text" id="address" placeholder="Nhập địa chỉ">
                    </div>

                    <!-- POSITION -->
                    <div class="form-group">
                        <label for="position">Chức vụ</label>
                        <input type="text" id="position" placeholder="Ví dụ: Nhân viên">
                    </div>

                    <!-- DEPARTMENT -->
                    <div class="form-group">
                        <label for="departmentId">Phòng ban <span>*</span></label>
                        <select id="departmentId" required>
                            <option value="">-- Chọn phòng ban --</option>
                        </select>
                    </div>

                    <!-- MESSAGE -->
                    <div id="message" class="message"></div>

                    <!-- BUTTON -->
                    <button type="submit" class="btn-register">Đăng ký</button>
                </form>

                <!-- LOGIN LINK -->
                <div class="login-link">
                    <span>Đã có tài khoản?</span>
                    <a href="../auth/login.html">Đăng nhập</a>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <span>© 2026 LeaveManager</span>
            <span>Employee Leave Management System</span>
        </footer>
    </div>

    <script type="module" src="../js/authJs/register.js"></script>
</body>
</html>
