<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Duyệt đơn nghỉ</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/managerCss/managerDashboard.css">
    <link rel="stylesheet" href="../../css/managerCss/requestApproval.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">LeaveFlow</div>
        <nav>
            <a href="./managerDashboard.html">Tổng quan</a>
            <a class="active" href="./requestApproval.html">Duyệt đơn nghỉ</a>
            <a href="./employeeManagement.html">Quản lý nhân viên</a>
            <a href="../user/profile.html">Hồ sơ cá nhân</a>
        </nav>
        <button id="logoutButton" type="button">Đăng xuất</button>
    </div>
    <div class="main">
        <div class="header">
            <div>
                <div class="page-title">Duyệt đơn nghỉ</div>
                <div class="page-description">Xem và xử lý yêu cầu nghỉ phép của nhân viên</div>
            </div>
            <div class="user">
                <div class="user-information">
                    <div id="fullName" class="user-name"></div>
                    <div id="position" class="user-position"></div>
                </div>
                <img class="avatar" src="../../assets/images/cute.jpg" alt="Ảnh đại diện">
            </div>
        </div>
        <div class="approval-content">
            <div class="summary">
                <div class="summary-item pending">
                    <div class="summary-icon">⌛</div>
                    <div>
                        <div class="summary-label">Chờ duyệt</div>
                        <div id="pendingCount" class="summary-number">—</div>
                    </div>
                </div>
                <div class="summary-item approved">
                    <div class="summary-icon">✓</div>
                    <div>
                        <div class="summary-label">Đã duyệt</div>
                        <div id="approvedCount" class="summary-number">—</div>
                    </div>
                </div>
                <div class="summary-item rejected">
                    <div class="summary-icon">×</div>
                    <div>
                        <div class="summary-label">Từ chối</div>
                        <div id="rejectedCount" class="summary-number">—</div>
                    </div>
                </div>
            </div>
            <div class="filter-box">
                <div class="filter-item search">
                    <label for="keyword">Tìm kiếm</label>
                    <input id="keyword" type="text" placeholder="Tên nhân viên hoặc mã đơn">
                </div>
                <div class="filter-item">
                    <label for="leaveTypeFilter">Loại nghỉ</label>
                    <select id="leaveTypeFilter">
                        <option value="">Tất cả loại nghỉ</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="statusFilter">Trạng thái</label>
                    <select id="statusFilter">
                        <option value="">Tất cả trạng thái</option>
                        <option value="1">Chờ duyệt</option>
                        <option value="2">Đã duyệt</option>
                        <option value="3">Đã từ chối</option>
                        <option value="4">Đã hủy</option>
                    </select>
                </div>
                <button id="searchButton" class="search-button" type="button">Tìm kiếm</button>
                <button id="resetButton" class="reset-button" type="button">Đặt lại</button>
            </div>
            <div class="request-list">
                <div class="list-header">
                    <div>
                        <div class="list-title">Danh sách đơn nghỉ</div>
                        <div id="requestDescription" class="list-description"></div>
                    </div>
                </div>
                <div class="request-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Nhân viên</th>
                                <th>Loại nghỉ</th>
                                <th>Thời gian nghỉ</th>
                                <th>Số ngày</th>
                                <th>Lý do</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="requestTableBody"></tbody>
                    </table>
                    <div id="emptyRequest" class="empty-data" hidden>
                        Không tìm thấy đơn nghỉ phép
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../../js/managerJs/requestApproval.js"></script>
</body>
</html>
