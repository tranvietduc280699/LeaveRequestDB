<div id="profilePopup" class="profile-popup">
    <div class="profile-popup-content">
        <div class="profile-popup-header">
            <div>
                <div class="popup-title">Cập nhật hồ sơ</div>
                <div class="popup-description">Thay đổi thông tin cá nhân của bạn</div>
            </div>
            <div id="closeProfilePopup" class="popup-close">×</div>
        </div>
        <div class="profile-popup-body">
            <div class="form-group">
                <div class="form-label">Mã nhân viên</div>
                <input type="text" id="editEmployeeCode" readonly>
            </div>
            <div class="form-group">
                <div class="form-label">Họ và tên</div>
                <input type="text" id="editFullName" placeholder="Nhập họ và tên">
                <div id="editFullNameError" class="error-message"></div>
            </div>
            <div class="form-group">
                <div class="form-label">Email</div>
                <input type="email" id="editEmail" readonly>
            </div>
            <div class="form-group">
                <div class="form-label">Số điện thoại</div>
                <input type="text" id="editPhone" placeholder="Nhập số điện thoại">
                <div id="editPhoneError" class="error-message"></div>
            </div>
            <div class="form-group full-width">
                <div class="form-label">Địa chỉ</div>
                <input type="text" id="editAddress" placeholder="Nhập địa chỉ">
                <div id="editAddressError" class="error-message"></div>
            </div>
            <div id="editProfileMessage" class="profile-message"></div>
        </div>
        <div class="profile-popup-footer">
            <div id="cancelProfileButton" class="cancel-button">Hủy</div>
            <div id="saveProfileButton" class="save-button">Lưu thay đổi</div>
        </div>
    </div>
</div>
